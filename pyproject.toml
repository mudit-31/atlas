[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-verify"
version = "2.0.0"
description = "ATLAS: research reports with claim-level verification, built on Gemini."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0",
    "tavily-python>=0.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
